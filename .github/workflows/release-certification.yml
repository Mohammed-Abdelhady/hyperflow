name: release-certification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Certify release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Plugin validation
        run: npm run validate-plugin

      - name: Unit tests
        run: npm run unittest

      - name: Golden evals
        run: npm run evals

      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh

      - name: Tag matches package version
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "FAIL: tag $GITHUB_REF_NAME does not match package.json $VERSION" >&2
            exit 1
          fi

      - name: Patch hygiene
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            git diff --check "$PREVIOUS_TAG...HEAD"
          else
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE" HEAD
          fi
